apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata:
      labels: {app: gateway}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      containers:
        - name: gateway
          image: inference-gateway/gateway:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: inference-config}}]
          env:
            - {name: API_KEYS, valueFrom: {secretKeyRef: {name: inference-secrets, key: API_KEYS}}}
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: {app: gateway}
  ports: [{port: 8000}]
---
# The gateway is I/O-bound and cheap, so CPU is a fine scaling signal here.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
